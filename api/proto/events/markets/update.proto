syntax = "proto3";

package events.markets.v1;

option go_package = "github.com/nullableocean/grpcservices/api/gen/events/markets/v1;marketseventsv1";

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

// MarketUpdated — событие об изменении данных рынка
message MarketUpdated {
    // UUID обновлённого рынка
    string market_uuid = 1 [(validate.rules).string = {uuid: true}];
    // Время создания события
    google.protobuf.Timestamp updated_at = 2;
}